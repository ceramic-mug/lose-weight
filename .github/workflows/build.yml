# Compiles the app on every push. No Apple account or secrets needed.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::No Xcode 26 on this runner"; ls /Applications; exit 1; fi
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Core tests
        run: swift test --package-path Packages/LoseWeightCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build for iOS Simulator
        run: |
          xcodebuild build -quiet \
            -project LoseWeight.xcodeproj -scheme LoseWeight \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for macOS
        run: |
          xcodebuild build -quiet \
            -project LoseWeight.xcodeproj -scheme LoseWeight \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
